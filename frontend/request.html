<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채번 의뢰 · Unique Code System</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="assets/css/ucs-theme.css">
</head>
<body>

  <!-- ─── Navbar ─────────────────────────────────────── -->
  <nav class="navbar ucs-navbar py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <span class="brand-mark"><i class="fa-solid fa-hashtag"></i></span>
        <span>Unique Code System</span>
      </a>
      <a href="index.html"
         class="btn btn-outline-secondary btn-sm fw-medium px-3">
        <i class="fa-solid fa-arrow-left"></i> 메인으로
      </a>
    </div>
  </nav>

  <main class="container py-4">

    <!-- Page Header -->
    <div class="mb-4">
      <h1 class="h4 fw-bold text-dark mb-1">
        <i class="fa-solid fa-pen-to-square text-primary me-2"></i>채번 의뢰
      </h1>
      <p class="text-muted small mb-0">
        필요한 코드 의뢰서를 작성합니다. 담당 채번자가 검토 후 발급합니다.
      </p>
    </div>

    <div class="row g-4">

      <!-- ① 의뢰 폼 ─────────────────────────────── -->
      <div class="col-12 col-lg-5">
        <div class="card shadow-sm border border-1 rounded-3 overflow-hidden">
          <div class="card-header bg-light d-flex justify-content-between
                      align-items-center py-3 px-4">
            <h2 class="h6 fw-semibold m-0 text-dark">
              <i class="fa-solid fa-file-circle-plus me-2 text-primary"></i>의뢰서 작성
            </h2>
          </div>
          <div class="card-body p-4">
            <form id="requestForm" novalidate>

              <!-- 의뢰자 -->
              <div class="mb-3">
                <label for="reqRequester"
                       class="form-label fw-semibold small text-dark mb-1">
                  의뢰자 <span class="text-danger">*</span>
                </label>
                <input type="text"
                       id="reqRequester"
                       name="requester"
                       class="form-control"
                       maxlength="64"
                       placeholder="예: 홍길동"
                       required>
              </div>

              <!-- 사유 -->
              <div class="mb-3">
                <label for="reqReason"
                       class="form-label fw-semibold small text-dark mb-1">
                  사유 <span class="text-danger">*</span>
                </label>
                <textarea id="reqReason"
                          name="reason"
                          class="form-control"
                          rows="3"
                          maxlength="512"
                          placeholder="예: 신규 서비스 식별자 발급 필요"
                          required></textarea>
                <div class="form-text text-muted">최대 512자</div>
              </div>

              <!-- 희망 Prefix (선택) -->
              <div class="mb-3">
                <label for="reqPrefix"
                       class="form-label fw-semibold small text-dark mb-1">
                  희망 Prefix <span class="text-muted small fw-normal">(선택)</span>
                </label>
                <input type="text"
                       id="reqPrefix"
                       name="desired_prefix"
                       class="form-control form-control-lg ucs-input-code ucs-input-prefix"
                       maxlength="16"
                       placeholder="DEV">
                <div class="form-text text-muted">
                  영문·숫자 입력 가능 · 자동 대문자 변환
                </div>
              </div>

              <!-- 비고 -->
              <div class="mb-4">
                <label for="reqNote"
                       class="form-label fw-semibold small text-dark mb-1">
                  비고 <span class="text-muted small fw-normal">(선택)</span>
                </label>
                <input type="text"
                       id="reqNote"
                       name="note"
                       class="form-control"
                       maxlength="512"
                       placeholder="추가 안내사항">
              </div>

              <!-- 미리보기 (§5.2) -->
              <div class="card border-primary border-1 bg-light mb-4">
                <div class="card-body text-center py-3">
                  <div class="small text-muted text-uppercase mb-2"
                       style="letter-spacing: .08em;">의뢰 미리보기</div>
                  <div class="ucs-code ucs-code-primary fs-5" id="reqPreview">
                    [의뢰자] · [희망 Prefix]
                  </div>
                </div>
              </div>

              <!-- 액션 -->
              <div class="d-flex justify-content-end gap-2">
                <button type="reset"
                        class="btn btn-outline-secondary fw-medium px-3 py-2"
                        id="resetBtn">
                  초기화
                </button>
                <button type="submit"
                        id="submitBtn"
                        class="btn btn-primary btn-lg fw-bold px-4 py-2
                               d-inline-flex align-items-center justify-content-center
                               gap-2 shadow-sm">
                  <i class="fa-solid fa-paper-plane"></i>
                  <span>의뢰 접수</span>
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>

      <!-- ② 의뢰 목록 ─────────────────────────────── -->
      <div class="col-12 col-lg-7">
        <div class="card shadow-sm border border-1 rounded-3 overflow-hidden">
          <div class="card-header bg-light d-flex justify-content-between
                      align-items-center py-3 px-4">
            <h2 class="h6 fw-semibold m-0 text-dark">
              <i class="fa-solid fa-list-check me-2 text-primary"></i>
              내 의뢰 목록
              <span class="text-muted fw-normal small ms-2" id="reqCount">(0)</span>
            </h2>
            <div class="d-flex align-items-center gap-2">
              <select id="statusFilter"
                      class="form-select form-select-sm"
                      style="width:auto;">
                <option value="">전체 상태</option>
                <option value="PENDING">PENDING</option>
                <option value="APPROVED">APPROVED</option>
                <option value="REJECTED">REJECTED</option>
              </select>
              <button type="button"
                      id="refreshListBtn"
                      class="btn btn-outline-secondary btn-sm fw-medium">
                <i class="fa-solid fa-rotate-right"></i>
              </button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr class="small text-muted fw-semibold text-uppercase"
                    style="letter-spacing: .06em;">
                  <th class="px-3 py-2">ID</th>
                  <th class="px-3 py-2">의뢰자</th>
                  <th class="px-3 py-2">사유</th>
                  <th class="px-3 py-2">상태</th>
                  <th class="px-3 py-2">발급 코드</th>
                  <th class="px-3 py-2">접수일시</th>
                </tr>
              </thead>
              <tbody id="reqTableBody">
                <tr>
                  <td colspan="6" class="text-center text-muted py-5">
                    <i class="fa-solid fa-inbox fa-2x mb-2 d-block"></i>
                    의뢰가 없습니다.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="container py-4 text-center text-muted small">
    © Unique Code System
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>window.UCS_API_BASE = "";  /* 동일 오리진(단일 포트) 상대경로 */</script>
  <script src="assets/js/ucs-common.js"></script>
  <script src="assets/js/request.js"></script>
</body>
</html>
